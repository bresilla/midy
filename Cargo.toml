[package]
name = "midy"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Read MIDI files as editable text and apply text edits back to MIDI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bresilla/midy"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "midy"
path = "src/main.rs"

[dependencies]
midly = { version = "0.5", default-features = false, features = ["alloc", "std"] }
serde_json = "1"

[dev-dependencies]
